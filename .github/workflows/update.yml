name: Auto Update Sports Data & Streams

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে রান হবে (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Node 20 deprecation warning রিমুভ করার এনভায়রনমেন্ট
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  STREAM_SITE_URL: ${{ secrets.STREAM_SITE_URL }}

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install playwright

      - name: Get Installed Playwright Version
        id: playwright-version
        run: |
          echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Chromium Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (Only on Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Ensure OS Dependencies are installed
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Scan & Fetch Direct Streams
        run: |
          python collect_data.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git add cricket/ football/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update live streams & playlists [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
