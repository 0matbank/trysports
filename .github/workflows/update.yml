name: Auto Update Sports Data & Streams

on:
  schedule:
    # Avoid the top of the hour, when GitHub documents the highest scheduler load.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trysports-publisher-${{ github.ref }}
  cancel-in-progress: false

env:
  STREAM_SITE_URL: ${{ secrets.STREAM_SITE_URL }}
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
  SCAN_CONCURRENCY: '4'

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: true

      - name: Resolve latest stable Playwright version
        id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json, urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/playwright/json", timeout=20))["info"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Playwright version returned by PyPI: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest stable Playwright version: $version"

      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-py${{ steps.python.outputs.python-version }}-deps-${{ hashFiles('requirements.txt') }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-py${{ steps.python.outputs.python-version }}-

      - name: Restore exact Playwright runtime
        id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            .playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-runtime-py${{ steps.python.outputs.python-version }}-deps-${{ hashFiles('requirements.txt') }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright only when the exact runtime is not cached
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "playwright==${{ steps.playwright.outputs.version }}"
          python -m playwright install chromium

      - name: Validate cached or newly installed runtime
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          expected = "${{ steps.playwright.outputs.version }}"
          installed = version("playwright")
          if installed != expected:
              raise SystemExit(f"Playwright version mismatch: expected {expected}, got {installed}")

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
              if not executable.is_file():
                  raise SystemExit(f"Cached Chromium executable is missing: {executable}")

          print(f"Validated cached runtime: Playwright {installed}")
          PY

      - name: Run collector tests
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m unittest discover -s tests -v

      - name: Scan and fetch direct streams
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          if [[ -f scanner/collect_data.py ]]; then
            python scanner/collect_data.py
          else
            python collect_data.py
          fi

      - name: Commit validated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cricket/ football/

          if git diff --cached --quiet; then
            echo "No validated output changes to commit"
            exit 0
          fi

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$remote_sha" != "${{ steps.source.outputs.sha }}" ]]; then
            echo "Remote main changed during this scan; refusing to publish stale output" >&2
            exit 1
          fi

          git commit -m "Auto-update live streams & playlists [skip ci]"
          git push origin HEAD:main
